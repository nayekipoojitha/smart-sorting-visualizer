<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Smart Sorting Visualizer</h1>

    <div class="controls">
        <button onclick="generateArray()">Generate Array</button>
        <button onclick="bubbleSort()">Bubble Sort</button>
        <button onclick="mergeSortWrapper()">Merge Sort</button>
        <button onclick="quickSortWrapper()">Quick Sort</button>
    </div>

    <div class="chart">
        <div class="y-axis">
            <span>250</span>
            <span>200</span>
            <span>150</span>
            <span>100</span>
            <span>50</span>
            <span>0</span>
        </div>
        <div id="array"></div>

    </div>

    <p id="time"></p>

    <script src="script.js"></script>

</body>
</html>
